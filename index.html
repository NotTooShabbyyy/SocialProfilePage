<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lemon&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles/style.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
    <div class="social-card-container">
      <div class="social-card-section" id="profile-img">
        <img src="assets/images/avatar-jessica.jpeg" alt="avatar">
      </div>
      <div class="social-card-section" id="header-text">
        <h1>Jessica Randall</h1>
        <h2>London, United Kingdom</h2>
      </div>
      <div class="social-card-section" id="header-description">
        <p>"Front end developer and avid reader"</p>
      </div>
      <div class="social-card-section">
        <button>Github</button>
      </div>
      <div class="social-card-section">
        <button>Frontend Mentor</button>
      </div>
      <div class="social-card-section">
        <button>LinkedIn</button>
      </div>
      <div class="social-card-section">
        <button>Twitter</button>
      </div>
      <div class="social-card-section">
        <button>Instagram</button>
      </div>
    </div>
  </div>

<!--   
  <div class="attribution">

  </div> -->
</body>
</html>
